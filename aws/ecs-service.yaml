AWSTemplateFormatVersion: '2010-09-09'
Description: AI HealthGuard AWS ECS deployment stack

Parameters:
  ClusterName:
    Type: String
    Default: ai-healthguard-cluster
  ServiceName:
    Type: String
    Default: ai-healthguard-service
  DesiredCount:
    Type: Number
    Default: 1
  ContainerImage:
    Type: String
    Description: ECR image URI e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com/ai-healthguard:latest
  AppPort:
    Type: Number
    Default: 3000
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

Resources:
  ExecutionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/ai-healthguard
      RetentionInDays: 14

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic to AI HealthGuard
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref AppPort
          ToPort: !Ref AppPort
          CidrIp: 0.0.0.0/0

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: ai-healthguard-task
      Cpu: 512
      Memory: 1024
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: arn:aws:iam::123456789012:role/ecsTaskExecutionRole
      TaskRoleArn: arn:aws:iam::123456789012:role/ai-healthguard-task-role
      ContainerDefinitions:
        - Name: ai-healthguard
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: !Ref AppPort
              HostPort: !Ref AppPort
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: !Ref AppPort
            - Name: HOST
              Value: 0.0.0.0
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/ai-healthguard
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ai-healthguard

  Service:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref ClusterName
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref SecurityGroup
          Subnets: !Ref SubnetIds
      TaskDefinition: !Ref TaskDefinition
      ServiceName: !Ref ServiceName
